name: UniSync Auto Scraper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      category_id:
        description: 'Optional category ID for a read-only source health check'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: unisync-auto-scraper
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Config
        run: python scripts/validate_config.py

      - name: Check Selected Source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.category_id != '' }}
        env:
          CATEGORY_ID: ${{ inputs.category_id }}
        run: python scripts/check_all_sources.py --category-id "$CATEGORY_ID" --workers 1 --retry-empty 1

      - name: Run UniSync Engine
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.category_id == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python src/main.py

      - name: Commit Category Preview Updates
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.category_id == '' }}
        run: |
          if git diff --quiet -- category-previews.json; then
            echo "category-previews.json has no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add category-previews.json
          git commit -m "chore: update category preview cache [skip ci]"
          git push
